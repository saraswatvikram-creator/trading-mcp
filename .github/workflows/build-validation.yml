name: Build Validation

on:
  push:
    branches: [main, feature/realised-pnl-ledger-core]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run deploy -- --dry-run

      - name: Test realised P&L ledger
        run: npm test
